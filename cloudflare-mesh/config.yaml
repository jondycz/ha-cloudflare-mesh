name: Cloudflare Mesh
version: 1.0.2
slug: cloudflare-mesh
description: Run a Cloudflare One Mesh connector on Home Assistant.
image: ghcr.io/jondycz/ha-cloudflare-mesh
url: https://github.com/jondycz/ha-cloudflare-mesh
startup: services
boot: auto
init: false
arch:
  - aarch64
  - amd64
host_network: true
full_access: true
devices:
  - /dev/net/tun
privileged:
  - NET_ADMIN
  - NET_RAW
map:
  - type: data
    read_only: false
    path: /var/lib/cloudflare-warp
options:
  mesh_node_token: null
  srcnat_enabled: true
schema:
  mesh_node_token: password
  srcnat_enabled: bool